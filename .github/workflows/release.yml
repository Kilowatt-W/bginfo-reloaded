# Baut bei einem Versions-Tag (z. B. v2.2.0) die BGInfo-Reloaded.exe und haengt sie zusammen mit
# einer frisch erzeugten Beispielkonfiguration (BGInfo-Reloaded.sample.json) an ein
# GitHub-Release. Der Dateiname des Assets muss exakt "BGInfo-Reloaded.exe" bleiben - darauf
# verlaesst sich --update (AssetName in src/GitHubUpdater.cs).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # --update vergleicht den Tag mit der eingebauten Version; beide muessen zusammenpassen.
      - name: Tag gegen Version im Projekt pruefen
        shell: pwsh
        run: |
          # Mehrere PropertyGroups: nur die mit <Version> zaehlt (sonst haengt ein Leerzeichen an)
          $version = ([xml](Get-Content src/BGInfo-Reloaded.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME passt nicht zu <Version>$version</Version> in src/BGInfo-Reloaded.csproj."
          }

      - name: BGInfo-Reloaded.exe bauen
        run: dotnet publish src/BGInfo-Reloaded.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      # Der Editor wird nicht verteilt; er wird nur mitgebaut, damit ein Release nie einen Stand
      # traegt, mit dem der Editor nicht mehr kompiliert.
      - name: Editor bauen (nur Pruefung)
        run: dotnet build editor/BGInfo-Reloaded-Editor.csproj -c Release

      # Zweites Asset: die Beispielkonfiguration, von der gerade gebauten exe neu geschrieben. Damit
      # enthaelt sie immer alle Optionen dieser Version (auch solche, die in der Datei im Repository
      # noch fehlen) und als Kommentar alle Platzhalter. Die exe ist fensterlos - deshalb
      # Start-Process -Wait, sonst wartet der Schritt nicht und es gibt keinen Exit-Code.
      - name: Beispielkonfiguration im aktuellen Format erzeugen
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish/BGInfo-Reloaded.exe'
          $sample = Join-Path $PWD 'publish/BGInfo-Reloaded.sample.json'
          $check = Join-Path $env:RUNNER_TEMP 'BGInfo-Reloaded.check.json'
          function Invoke-BGInfo([string[]] $Arguments) {
            $process = Start-Process $exe -ArgumentList $Arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              Get-Content (Join-Path $env:LOCALAPPDATA 'BGInfo-Reloaded/bginfo.log') -Tail 20 -ErrorAction SilentlyContinue
              throw "BGInfo-Reloaded.exe $($Arguments -join ' ') endete mit Exit-Code $($process.ExitCode)."
            }
          }
          Invoke-BGInfo @('--export-config', "`"$sample`"", '--config', "`"$(Join-Path $PWD 'BGInfo-Reloaded.sample.json')`"", '--with-placeholders')
          # Gegenprobe: die erzeugte Datei muss sich wieder einlesen lassen.
          Invoke-BGInfo @('--export-config', "`"$check`"", '--config', "`"$sample`"")
          if (-not (Select-String -Path $sample -SimpleMatch '{hostname}' -Quiet)) {
            throw "Die erzeugte Beispielkonfiguration enthaelt keine Platzhalter-Liste."
          }
          Get-Item $sample | Select-Object Name, Length

      - name: Release anlegen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME publish/BGInfo-Reloaded.exe publish/BGInfo-Reloaded.sample.json --title "BGInfo-Reloaded $env:GITHUB_REF_NAME" --generate-notes
